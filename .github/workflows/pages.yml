# Publishes the talk website (charla/) to GitHub Pages.
# Independent from deploy.yml: it needs no AWS credentials and it keeps
# working even if the game deployment is down.
name: Publish talk site

on:
  push:
    branches: [main]
    paths:
      - "charla/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: charla
      - id: deployment
        uses: actions/deploy-pages@v4
