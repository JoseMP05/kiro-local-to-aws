# Pruebas en cada PR. Corre también para PRs de forks: no usa secretos ni AWS.
name: Pruebas

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Instalar dependencias
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Pruebas
        run: pnpm test
