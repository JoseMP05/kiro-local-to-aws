<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tanques — Espectador</title>
  <style>
    html, body {
      margin: 0; height: 100%; background: #202020; color: #f5f5f5; overflow: hidden;
      font-family: "Courier New", Courier, monospace; font-weight: bold;
    }
    #spectator-canvas { display: block; }
    #status {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: #0d1420; border: 3px solid #f5f5f5; box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0,0,0,0.7);
      padding: 16px 24px; font-size: 22px; color: #ffd54f; letter-spacing: 0.1em;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0.4; } }
    .hidden { display: none; }
  </style>
</head>
<body>
  <canvas id="spectator-canvas"></canvas>
  <div id="status" class="hidden">DESCONECTADO, REINTENTANDO…</div>
  <script type="module" src="/espectador/main.js"></script>
</body>
</html>
