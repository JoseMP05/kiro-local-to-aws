<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tanques</title>
  <style>
    :root {
      --fg: #f5f5f5;
      --accent: #ffd54f;
      --green: #43a047;
      --green-light: #b9f6ca;
      --red: #ef5350;
      --panel: #0d1420;
      --font: "Courier New", Courier, monospace;
    }
    html, body {
      margin: 0; height: 100%; background: #202020; color: var(--fg);
      font-family: var(--font); font-weight: bold; overflow: hidden;
    }
    #game-canvas { display: block; }

    .screen {
      position: absolute; inset: 0; z-index: 10; overflow: auto;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; padding: 24px; box-sizing: border-box;
      background: radial-gradient(ellipse at center, #1c2b1c 0%, #070a07 80%);
    }
    /* Líneas de barrido estilo CRT. */
    .screen::after {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
    }
    .hidden { display: none !important; }

    .title {
      margin: 0; font-size: clamp(40px, 9vw, 88px); letter-spacing: 0.12em; color: var(--accent);
      text-shadow: 4px 4px 0 #b71c1c, 8px 8px 0 #000;
    }
    .subtitle { margin: -12px 0 0; letter-spacing: 0.3em; color: var(--green-light); font-size: 14px; }

    .panels { display: flex; flex-wrap: wrap; gap: 28px; justify-content: center; }
    .panel {
      background: var(--panel); border: 3px solid var(--fg); padding: 20px 24px;
      box-shadow: 0 0 0 3px #000, 8px 8px 0 3px rgba(0,0,0,0.7); min-width: 280px;
    }
    .panel h2 { margin: 0 0 14px; font-size: 16px; color: var(--accent); letter-spacing: 0.15em; }

    label { display: block; font-size: 14px; margin-bottom: 8px; letter-spacing: 0.1em; }
    .row { display: flex; gap: 10px; }
    input, button { font-family: var(--font); font-weight: bold; font-size: 18px; }
    input {
      flex: 1; min-width: 0; padding: 10px 12px; background: #000; color: var(--green-light);
      border: 3px solid var(--green); outline: none; caret-color: var(--accent);
    }
    input:focus { border-color: var(--accent); }
    button {
      padding: 10px 16px; cursor: pointer; background: var(--green); color: #000;
      border: 3px solid #000; box-shadow: 4px 4px 0 #000; letter-spacing: 0.08em;
    }
    button:hover { background: #66bb6a; }
    button:active { transform: translate(4px, 4px); box-shadow: none; }
    #nick-error { color: var(--red); min-height: 20px; margin-top: 12px; font-size: 14px; }

    .controls { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; font-size: 14px; }
    .controls li { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
    .keys { display: flex; gap: 4px; align-items: center; }
    .keys small { font-size: 12px; color: #9e9e9e; margin: 0 4px; }
    kbd {
      display: inline-block; min-width: 14px; text-align: center; padding: 3px 7px;
      background: #e0e0e0; color: #111; border: 2px solid #000; border-bottom-width: 5px;
      font-family: var(--font); font-weight: bold; font-size: 13px;
    }

    .blink { animation: blink 1.1s steps(1) infinite; letter-spacing: 0.2em; font-size: 14px; color: var(--accent); }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
</head>
<body>
  <div id="screen-join" class="screen">
    <h1 class="title">TANQUES</h1>
    <p class="subtitle">ARENA MULTIJUGADOR</p>

    <div class="panels">
      <div class="panel">
        <h2>JUGADOR 1</h2>
        <form id="join-form">
          <label for="nick-input">TU APODO</label>
          <div class="row">
            <input id="nick-input" type="text" placeholder="Ana_99" autocomplete="off" autofocus />
            <button type="submit">ENTRAR ►</button>
          </div>
        </form>
        <div id="nick-error"></div>
      </div>

      <div class="panel">
        <h2>CONTROLES</h2>
        <ul class="controls">
          <li><span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd><small>o</small><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span><span>MOVER</span></li>
          <li><span class="keys"><kbd>RATÓN</kbd></span><span>APUNTAR</span></li>
          <li><span class="keys"><kbd>CLIC</kbd></span><span>DISPARAR</span></li>
          <li><span class="keys"><kbd>H</kbd></span><span>MOSTRAR / OCULTAR AYUDA</span></li>
        </ul>
      </div>
    </div>

    <p class="blink">ESCRIBE TU APODO Y PULSA ENTRAR</p>
  </div>

  <canvas id="game-canvas"></canvas>

  <div id="screen-disconnect" class="screen hidden">
    <h1 class="title">DESCONECTADO</h1>
    <p class="subtitle">SE PERDIÓ LA CONEXIÓN CON EL SERVIDOR</p>
    <button id="rejoin-button">VOLVER A ENTRAR ►</button>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
